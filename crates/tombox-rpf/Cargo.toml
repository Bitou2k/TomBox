[package]
name = "tombox-rpf"
version = "0.1.0"
edition = "2021"
description = "Inspector for RAGE package files (.rpf): header fields, region map, and shader records stored outside the encrypted table of contents. Does not decrypt."
license = "MIT OR Apache-2.0"

[lib]
name = "tombox_rpf"
path = "src/lib.rs"

[[bin]]
name = "rpf-inspect"
path = "src/bin/rpf-inspect.rs"

[[bin]]
name = "rpf-shaders"
path = "src/bin/rpf-shaders.rs"

[[bin]]
name = "rpf-carve"
path = "src/bin/rpf-carve.rs"

[dependencies]
# Only an inflater (deflate-compressed shader records); everything else is hand-checked parsing.
miniz_oxide = "0.8"
