name: Windows CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      RUST_TOOLCHAIN: 1.100.0-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install "$env:RUST_TOOLCHAIN" --profile minimal

      - name: Run workspace tests
        run: cargo "+$env:RUST_TOOLCHAIN" test --locked --release --workspace

      - name: Build compatibility DLLs with static CRT
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: >-
          cargo "+$env:RUST_TOOLCHAIN" build --locked --release
          -p d3d12_xs -p xmem -p xcrdapi -p acphal -p dxcompiler_xs -p mfplat
