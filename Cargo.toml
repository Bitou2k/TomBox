# TomBox — Xbox Series X|S compatibility runtime (research project)
# Workspace root.
[workspace]
resolver = "2"
members = [
    "crates/tombox-pe",
    "crates/tombox-cli",
    "crates/tombox-archive",
    "crates/tombox-rpf",
    "crates/tombox-viewer",
    "crates/tombox-disasm",
    "crates/tombox-xshader",
    "crates/compat/compat-common",
    "crates/compat/xmem",
    "crates/compat/d3d12_xs",
    "crates/compat/xg_xs",
    "crates/compat/xcrdapi",
    "crates/compat/dxcompiler_xs",
    "crates/compat/acphal",
    "crates/compat/mfplat",
]

[profile.release]
opt-level = 3
debug = true
overflow-checks = true   # keep integer-overflow checks even in release for parser safety
